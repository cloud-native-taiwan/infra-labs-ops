services:
  account-automation:
    container_name: account-automation
    # Prebuilt by .github/workflows/build-tools.yml and pulled from GHCR.
    # IMAGE_TAG must be set to an immutable tag (e.g. sha-<commit>, as published
    # by build-tools.yml) -- deploying the floating "latest" tag is not a safe
    # default, since it can change under you between pulls.
    image: ghcr.io/cloud-native-taiwan/infra-labs-ops/account-automation:${IMAGE_TAG:?set IMAGE_TAG to a sha-<commit> tag from build-tools.yml}
    env_file:
      - .env
    environment:
      TZ: Asia/Taipei
      INFRA_LABS_GOOGLE_SERVICE_ACCOUNT_JSON: /secrets/service-account.json
      OS_CLIENT_CONFIG_FILE: /secrets/clouds.yaml
    volumes:
      # Directory, not single-file, mounts: Ansible replaces a secret by
      # rename (new inode), which a single-file bind mount would never see.
      - ./secrets:/secrets:ro
      # node_exporter textfile directory; a successful run writes
      # task_account_automation.prom here. Mounted at the same path as on the
      # host, which is the INFRA_LABS_TEXTFILE_COLLECTOR_DIR default. Must exist
      # owned by uid 10001 before `up` (the deploy playbook creates it);
      # otherwise Docker creates it root-owned and metric writes fail.
      - /var/lib/node_exporter/textfile_collector:/var/lib/node_exporter/textfile_collector
    restart: unless-stopped
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "pgrep", "-f", "supercronic"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

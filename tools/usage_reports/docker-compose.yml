services:
  usage-reports:
    container_name: usage-reports
    # Prebuilt by .github/workflows/build-tools.yml and pulled from GHCR.
    # IMAGE_TAG must be set to an immutable tag (e.g. sha-<commit>, as published
    # by build-tools.yml) -- deploying the floating "latest" tag is not a safe
    # default, since it can change under you between pulls.
    image: ghcr.io/cloud-native-taiwan/infra-labs-ops/usage-reports:${IMAGE_TAG:?set IMAGE_TAG to a sha-<commit> tag from build-tools.yml}
    env_file:
      - .env
    environment:
      TZ: Asia/Taipei
      OS_CLIENT_CONFIG_FILE: /secrets/clouds.yaml
    volumes:
      - ./secrets/clouds.yaml:/secrets/clouds.yaml:ro
      - ./state:/var/lib/usage-reports
    restart: unless-stopped
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "pgrep", "-f", "supercronic"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

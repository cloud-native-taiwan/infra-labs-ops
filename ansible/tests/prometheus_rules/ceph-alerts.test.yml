# promtool unit tests for kolla/config/prometheus/ceph-alerts.rules.
#
# Run by ansible/tests/test_prometheus_rules.py (which shells out to
# `promtool test rules` from this directory, so rule_files is relative to here).
# This file is upstream-derived (Ceph's prometheus_alerts.yml) and not fully
# covered: these cases pin only the rules fixed for the 2026-11-07 audit (M3).
#
# interval: 1m mirrors Kolla's default prometheus_scrape_interval (60s), which
# also drives prometheus_ceph_exporter_interval. The mgr exporter scrape job is
# named ceph_mgr_exporter in Kolla's prometheus.yml.j2, not upstream's "ceph".
rule_files:
  - ../../../kolla/config/prometheus/ceph-alerts.rules

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{instance="openstack01:9283",job="ceph_mgr_exporter"}'
        values: '0x10'
      - series: 'up{instance="openstack02:9283",job="ceph_mgr_exporter"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: CephMgrPrometheusModuleInactive
        exp_alerts:
          - exp_labels:
              severity: critical
              oid: "1.3.6.1.4.1.50495.1.2.1.6.2"
              type: "ceph_default"
              instance: "openstack01:9283"
              job: "ceph_mgr_exporter"
            exp_annotations:
              summary: "The mgr/prometheus module is not available"
              description: "The mgr/prometheus module at openstack01:9283 is unreachable. This could mean that the module has been disabled or the mgr daemon itself is down. Without the mgr/prometheus module metrics and alerts will no longer function. Open a shell to an admin node or toolbox pod and use 'ceph -s' to to determine whether the mgr is active. If the mgr is not active, restart it, otherwise you can determine module status with 'ceph mgr module ls'. If it is not listed as enabled, enable it with 'ceph mgr module enable prometheus'."

  - interval: 1m
    input_series:
      # 1000 pkt/s total, 20 drops/s and 20 errs/s (2%): both ratio and
      # absolute thresholds trip.
      - series: 'node_network_receive_packets_total{device="bond0",instance="openstack01:9100",job="node"}'
        values: '0+60000x20'
      - series: 'node_network_transmit_packets_total{device="bond0",instance="openstack01:9100",job="node"}'
        values: '0x20'
      - series: 'node_network_receive_drop_total{device="bond0",instance="openstack01:9100",job="node"}'
        values: '0+1200x20'
      - series: 'node_network_transmit_drop_total{device="bond0",instance="openstack01:9100",job="node"}'
        values: '0x20'
      - series: 'node_network_receive_errs_total{device="bond0",instance="openstack01:9100",job="node"}'
        values: '0+1200x20'
      - series: 'node_network_transmit_errs_total{device="bond0",instance="openstack01:9100",job="node"}'
        values: '0x20'
      # Tenant VM tap devices are excluded: a guest flooding its own vNIC is
      # not a host/Ceph network fault.
      - series: 'node_network_receive_packets_total{device="tap1234abcd-56",instance="openstack01:9100",job="node"}'
        values: '0+60000x20'
      - series: 'node_network_transmit_packets_total{device="tap1234abcd-56",instance="openstack01:9100",job="node"}'
        values: '0x20'
      - series: 'node_network_receive_drop_total{device="tap1234abcd-56",instance="openstack01:9100",job="node"}'
        values: '0+1200x20'
      - series: 'node_network_transmit_drop_total{device="tap1234abcd-56",instance="openstack01:9100",job="node"}'
        values: '0x20'
      - series: 'node_network_receive_errs_total{device="tap1234abcd-56",instance="openstack01:9100",job="node"}'
        values: '0+1200x20'
      - series: 'node_network_transmit_errs_total{device="tap1234abcd-56",instance="openstack01:9100",job="node"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: CephNodeNetworkPacketDrops
        exp_alerts:
          - exp_labels:
              severity: warning
              oid: "1.3.6.1.4.1.50495.1.2.1.8.2"
              type: "ceph_default"
              device: "bond0"
              instance: "openstack01:9100"
              job: "node"
            exp_annotations:
              summary: "One or more NICs reports packet drops"
              description: "Node openstack01:9100 experiences packet drop > 0.5% or > 10 packets/s on interface bond0."
      - eval_time: 10m
        alertname: CephNodeNetworkPacketErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              oid: "1.3.6.1.4.1.50495.1.2.1.8.3"
              type: "ceph_default"
              device: "bond0"
              instance: "openstack01:9100"
              job: "node"
            exp_annotations:
              summary: "One or more NICs reports packet errors"
              description: "Node openstack01:9100 experiences packet errors > 0.01% or > 10 packets/s on interface bond0."

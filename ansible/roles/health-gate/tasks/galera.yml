---
# Galera gate: every controller node must be wsrep Synced, and the cluster
# must see all expected members. A node in Donor/Desync or Joining still
# answers but is unsafe to lose; a shrunk cluster_size means we already lost
# a peer and must not disrupt another.
#
# Credentials: no secrets live in the repo. Kolla does not enable unix-socket
# auth (root requires a password), so the query authenticates with
# `health_gate_galera_password`, supplied at runtime from Kolla's vaulted
# passwords.yml (`-e @.../passwords.yml --ask-vault-pass`). The task is
# no_log so the password never reaches output or retry dumps.
#
# wsrep status vars queried from each node independently — there is no single
# authoritative node, so we check all of them and fail if any disagrees.

- name: Query wsrep state from every Galera node
  ansible.builtin.command:
    # Password travels on stdin as a client defaults file, never in argv,
    # so it is invisible to `ps` on the controller.
    stdin: |
      [client]
      user=root
      password={{ health_gate_galera_password }}
    argv:
      - docker
      - exec
      - --interactive
      - "{{ health_gate_galera_container }}"
      - mariadb
      - --defaults-extra-file=/dev/stdin
      - --batch
      - --skip-column-names
      - --execute
      - >-
        SELECT VARIABLE_NAME, VARIABLE_VALUE
        FROM information_schema.GLOBAL_STATUS
        WHERE VARIABLE_NAME IN
        ('WSREP_LOCAL_STATE_COMMENT','WSREP_CLUSTER_SIZE','WSREP_CLUSTER_STATUS','WSREP_READY');
  register: _health_gate_galera_raw
  no_log: true
  # Exhausted retries must not fail here: this task is no_log, so the
  # operator would see only "censored". The parse/report/assert below run
  # on the last reading instead and fail closed with a readable message (a
  # node with no output parses as UNKNOWN).
  ignore_errors: true  # noqa: ignore-errors
  changed_when: false
  delegate_to: "{{ item }}"
  # No default([]) on the group lookup: a typo'd group name must abort the
  # gate, not let it pass vacuously over zero nodes.
  loop: "{{ groups[health_gate_controller_group] }}"
  # health_gate_galera_wait_for_sync (post-reboot use) also polls until this
  # node reports Synced/Primary/ON at full size: peers keep the old cluster
  # size for a few seconds after a rebooted node rejoins. The pre-reboot
  # gate leaves it off and fails fast on any unsafe state.
  vars:
    # Same parse as _health_gate_wsrep in the next task (keep in sync).
    _health_gate_wsrep_poll: >-
      {{ dict(_health_gate_galera_raw.stdout_lines | default([])
              | map('split', none, 1) | selectattr('1', 'defined')) }}
  retries: >-
    {{ (health_gate_galera_wait_for_sync | bool)
       | ternary(health_gate_galera_sync_retries, health_gate_retries) | int }}
  delay: "{{ health_gate_delay_seconds | int }}"
  until: >-
    _health_gate_galera_raw.rc == 0
    and (
      not (health_gate_galera_wait_for_sync | bool)
      or (
        _health_gate_wsrep_poll.get('WSREP_LOCAL_STATE_COMMENT') == 'Synced'
        and _health_gate_wsrep_poll.get('WSREP_CLUSTER_STATUS') == 'Primary'
        and (_health_gate_wsrep_poll.get('WSREP_READY', '') | upper) == 'ON'
        and (_health_gate_wsrep_poll.get('WSREP_CLUSTER_SIZE', 0) | int)
            == (health_gate_galera_expected_size | int)
      )
    )

- name: Initialize Galera node state list
  ansible.builtin.set_fact:
    health_gate_galera_nodes: []

- name: Parse wsrep state per node
  vars:
    # --batch prints one "NAME<TAB>VALUE" line per variable; split each line
    # once on whitespace into a dict (values like "Joining: receiving State
    # Transfer" contain spaces). No regex: escape sequences inside a YAML block
    # scalar reach Jinja un-unescaped on ansible-core 2.19+, which made the
    # previous regex_search patterns match a literal backslash and crash.
    # Same parse as _health_gate_wsrep_poll on the query task above (keep in
    # sync). A line with an empty value is dropped (selectattr '1' defined) rather
    # than crashing dict(). Missing keys default to unsafe values, so the
    # assert below fails closed.
    _health_gate_wsrep: "{{ dict(item.stdout_lines | default([]) | map('split', none, 1)
      | selectattr('1', 'defined')) }}"
  ansible.builtin.set_fact:
    health_gate_galera_nodes: >-
      {{
        health_gate_galera_nodes
        + [{
            'node': item.item,
            'state': _health_gate_wsrep.get('WSREP_LOCAL_STATE_COMMENT', 'UNKNOWN'),
            'size': _health_gate_wsrep.get('WSREP_CLUSTER_SIZE', '0'),
            'status': _health_gate_wsrep.get('WSREP_CLUSTER_STATUS', 'UNKNOWN'),
            'ready': _health_gate_wsrep.get('WSREP_READY', 'OFF')
          }]
      }}
  loop: "{{ _health_gate_galera_raw.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Report Galera cluster state
  ansible.builtin.debug:
    msg: >-
      Galera {{ item.node }}: state={{ item.state }},
      cluster_status={{ item.status }}, size={{ item.size }}, ready={{ item.ready }}
  loop: "{{ health_gate_galera_nodes }}"
  loop_control:
    label: "{{ item.node }}"

- name: Assert every Galera node is Synced, Primary, ready and at full size
  ansible.builtin.assert:
    that:
      - item.state == 'Synced'
      - item.status == 'Primary'
      - (item.ready | upper) == 'ON'
      - (item.size | int) == (health_gate_galera_expected_size | int)
    fail_msg: >-
      Galera node {{ item.node }} is not safe to disrupt around:
      state={{ item.state }} (want Synced), cluster_status={{ item.status }}
      (want Primary), ready={{ item.ready }} (want ON),
      size={{ item.size }} (want {{ health_gate_galera_expected_size }}).
      A Donor/Joining/Desync node or a shrunk cluster means losing another
      node could break write quorum. Fix Galera before disrupting.
    success_msg: "Galera {{ item.node }} Synced/Primary at full size."
  loop: "{{ health_gate_galera_nodes }}"
  loop_control:
    label: "{{ item.node }}"

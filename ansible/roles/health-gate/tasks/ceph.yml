---
# Ceph gate: cluster health acceptable AND every OSD on the target host is
# ok-to-stop. Run inside a cephadm shell on the bootstrap host (the only
# place the Ceph CLI exists on this fleet); all commands delegate there.
#
# `ceph health` alone is insufficient — a cluster can be HEALTH_WARN for
# benign reasons yet still unsafe to lose a specific OSD (or vice versa). The
# authoritative question for "may I take this host down" is
# `ceph osd ok-to-stop <ids>`, which checks that no PG would go inactive.

- name: Check Ceph cluster health
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - health
      - --format
      - json
  register: _health_gate_ceph_health
  changed_when: false
  delegate_to: "{{ health_gate_ceph_host }}"
  timeout: "{{ health_gate_command_timeout_seconds | int }}"
  vars:
    _health_gate_ceph_report: "{{ _health_gate_ceph_health.stdout | from_json }}"
  # Wait mode also polls until the report is acceptable; otherwise only a
  # failed query is retried and the assert below judges the first reading.
  retries: >-
    {{ (health_gate_ceph_wait_for_health | bool)
       | ternary(health_gate_ceph_wait_retries, health_gate_retries) | int }}
  delay: "{{ health_gate_delay_seconds | int }}"
  until: >-
    _health_gate_ceph_health.rc == 0
    and (
      not (health_gate_ceph_wait_for_health | bool)
      or (health_gate_ceph_report_acceptable | bool)
    )

# Bound per task via vars, never set_fact: a set_fact of
# _health_gate_ceph_report would outrank the until's task var on a later gate
# run in the same play and freeze the wait-mode poll on a stale report.
- name: Store Ceph health status and check codes
  vars:
    _health_gate_ceph_report: "{{ _health_gate_ceph_health.stdout | from_json }}"
  ansible.builtin.set_fact:
    health_gate_ceph_status: "{{ _health_gate_ceph_report.status }}"
    # Check codes present now (e.g. OSDMAP_FLAGS). reboot.yml uses them as
    # the pre-reboot baseline: after the reboot no NEW code may remain.
    health_gate_ceph_checks: "{{ _health_gate_ceph_report.checks | default({}) | list | sort }}"

- name: Report Ceph cluster health
  ansible.builtin.debug:
    msg: "Ceph health status: {{ health_gate_ceph_status }} checks={{ health_gate_ceph_checks }}"

- name: Assert Ceph cluster health is acceptable
  vars:
    _health_gate_ceph_report: "{{ _health_gate_ceph_health.stdout | from_json }}"
  ansible.builtin.assert:
    that:
      - health_gate_ceph_report_acceptable | bool
    fail_msg: >-
      Ceph cluster health is {{ health_gate_ceph_status }} with checks
      {{ health_gate_ceph_checks }}. HEALTH_ERR is never safe to disrupt
      around. HEALTH_WARN requires health_gate_ceph_allow_warn=true (it is
      {{ health_gate_ceph_allow_warn }}), and even then these checks always
      fail the gate: {{ health_gate_ceph_blocking_checks }}.
    success_msg: "Ceph health {{ health_gate_ceph_status }} acceptable."

# One query feeds both the OSD and the mon checks below: `ceph node ls`
# (type "all") returns {"osd": {host: [ids]}, "mon": {host: [names]}, ...}.
- name: List OSDs and monitors per host from the cluster map
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - ceph
      - node
      - ls
      - --format
      - json
  register: _health_gate_ceph_nodes
  changed_when: false
  delegate_to: "{{ health_gate_ceph_host }}"
  timeout: "{{ health_gate_command_timeout_seconds | int }}"
  retries: "{{ health_gate_retries | int }}"
  delay: "{{ health_gate_delay_seconds | int }}"
  until: _health_gate_ceph_nodes.rc == 0

- name: Parse OSD and monitor ids on the target host
  ansible.builtin.set_fact:
    # Each map is keyed by hostname for every host carrying that daemon. A
    # host absent from a map is positive evidence the target carries none
    # (e.g. a pure compute node), which skips that ok-to-stop below. A
    # FAILED query, by contrast, fails the gate above rather than being
    # mistaken for "none" — that ambiguity is why the previous per-host
    # `osd ls-tree` + ignore-errors approach was unsafe. The type sections
    # are indexed strictly, so a missing "osd"/"mon" section aborts too.
    health_gate_target_osds: >-
      {{ (_health_gate_ceph_nodes.stdout | from_json)['osd'].get(health_gate_target_host, []) }}
    health_gate_target_mons: >-
      {{ (_health_gate_ceph_nodes.stdout | from_json)['mon'].get(health_gate_target_host, []) }}

- name: Note hosts with no OSDs skip ok-to-stop
  ansible.builtin.debug:
    msg: >-
      {{ health_gate_target_host }} hosts no Ceph OSDs; ok-to-stop check
      not applicable.
  when: health_gate_target_osds | length == 0

- name: Check ceph osd ok-to-stop for the target host's OSDs
  ansible.builtin.command:
    argv: >-
      {{
        ['cephadm', 'shell', '--', 'ceph', 'osd', 'ok-to-stop']
        + (health_gate_target_osds | map('string') | list)
      }}
  register: _health_gate_ceph_ok_to_stop
  changed_when: false
  failed_when: false
  delegate_to: "{{ health_gate_ceph_host }}"
  timeout: "{{ health_gate_command_timeout_seconds | int }}"
  # Wait mode polls while PGs re-peer after a disruption; otherwise a single
  # reading (retries 0) and the assert below decides.
  retries: >-
    {{ (health_gate_ceph_wait_for_health | bool)
       | ternary(health_gate_ceph_wait_retries, 0) | int }}
  delay: "{{ health_gate_delay_seconds | int }}"
  until: _health_gate_ceph_ok_to_stop.rc == 0
  # Exhausted wait-mode retries mark the task failed despite failed_when;
  # let the assert below report Ceph's reason instead.
  ignore_errors: true  # noqa: ignore-errors
  when: health_gate_target_osds | length > 0

- name: Assert the target host's OSDs are ok-to-stop
  ansible.builtin.assert:
    that:
      - _health_gate_ceph_ok_to_stop.rc | default(1) == 0
    fail_msg: >-
      `ceph osd ok-to-stop {{ health_gate_target_osds }}` failed (rc={{
      _health_gate_ceph_ok_to_stop.rc | default('none') }}). Stopping
      {{ health_gate_target_host }}'s OSDs now would risk inactive PGs and
      stalled RBD-backed VM I/O. Wait for recovery/backfill, then retry.
      Ceph said: {{ _health_gate_ceph_ok_to_stop.stderr | default(_health_gate_ceph_ok_to_stop.stdout) | trim }}
    success_msg: "OSDs {{ health_gate_target_osds }} on {{ health_gate_target_host }} are ok-to-stop."
  when: health_gate_target_osds | length > 0

# Monitors: same pattern as OSDs. `ceph mon ok-to-stop` refuses when stopping
# the target's mon(s) would break quorum (e.g. another mon is already down).
- name: Check ceph mon ok-to-stop for the target host's monitors
  ansible.builtin.command:
    argv: >-
      {{
        ['cephadm', 'shell', '--', 'ceph', 'mon', 'ok-to-stop']
        + (health_gate_target_mons | map('string') | list)
      }}
  register: _health_gate_ceph_mon_ok_to_stop
  changed_when: false
  failed_when: false
  delegate_to: "{{ health_gate_ceph_host }}"
  timeout: "{{ health_gate_command_timeout_seconds | int }}"
  retries: >-
    {{ (health_gate_ceph_wait_for_health | bool)
       | ternary(health_gate_ceph_wait_retries, 0) | int }}
  delay: "{{ health_gate_delay_seconds | int }}"
  until: _health_gate_ceph_mon_ok_to_stop.rc == 0
  ignore_errors: true  # noqa: ignore-errors
  when: health_gate_target_mons | length > 0

- name: Assert the target host's monitors are ok-to-stop
  ansible.builtin.assert:
    that:
      - _health_gate_ceph_mon_ok_to_stop.rc | default(1) == 0
    fail_msg: >-
      `ceph mon ok-to-stop {{ health_gate_target_mons }}` failed (rc={{
      _health_gate_ceph_mon_ok_to_stop.rc | default('none') }}). Stopping
      {{ health_gate_target_host }}'s monitor(s) now would break mon quorum.
      Bring every monitor back into quorum first.
      Ceph said: {{ _health_gate_ceph_mon_ok_to_stop.stderr | default(_health_gate_ceph_mon_ok_to_stop.msg | default('')) | trim }}
    success_msg: "Monitors {{ health_gate_target_mons }} on {{ health_gate_target_host }} are ok-to-stop."
  when: health_gate_target_mons | length > 0

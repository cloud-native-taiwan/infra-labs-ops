---
- name: Reload Sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Restart Chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted
    enabled: true

# Re-run the oneshot when the unit changes (e.g. governor value edited); a
# RemainAfterExit oneshot is skipped by `state: started` once already active.
- name: Reapply CPU governor
  ansible.builtin.systemd:
    name: cpu-governor.service
    state: restarted
    daemon_reload: true

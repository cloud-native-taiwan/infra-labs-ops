---
- name: Setup certificate renewal scheduling
  hosts: deploy_host
  become: true
  vars:
    remote_base: /opt/infra-labs-tools
    remote_tool_dir: "{{ remote_base }}/cert-renewal"
    kolla_ansible_venv: "/home/{{ ansible_user }}/venv"
    # certbot is installed via `uv tool install certbot --with certbot-dns-cloudflare`
    uv_tool_bin: "/home/{{ ansible_user }}/.local/bin"

  tasks:
    - name: Create remote tool directory
      ansible.builtin.file:
        path: "{{ remote_tool_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy certificate renewal script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/cert-renewal.sh"
        dest: "{{ remote_tool_dir }}/cert-renewal.sh"
        owner: root
        group: root
        mode: "0755"

    - name: Deploy certificate renewal systemd units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - cert-renewal.service
        - cert-renewal.timer

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start certificate renewal timer
      ansible.builtin.systemd:
        name: cert-renewal.timer
        enabled: true
        state: started

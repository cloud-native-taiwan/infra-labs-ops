---
- name: Bootstrap Managed Hosts (base)
  hosts: managed_hosts
  become: true
  roles:
    - role: base

# bond0 restarts roll one host at a time in canary order (handler
# `throttle: 1` alone still restarted every host back-to-back). Only this
# play is serial; see roles/network/tasks/main.yml and ansible/README.en.md.
- name: Apply Network Config One Host At A Time
  hosts: managed_hosts
  become: true
  gather_facts: false  # facts from the first play are still in memory
  serial: 1
  order: inventory
  # A failed gate stops the whole run, not just the rest of this play.
  any_errors_fatal: true
  roles:
    - role: network

- name: Bootstrap Managed Hosts
  hosts: managed_hosts
  become: true
  gather_facts: false
  roles:
    - role: mail
      tags:
        - mail
    - role: kvm
    - role: grub
    - role: swap
    - role: bbr
    - role: tuning
    - role: openstack05_battlemage
      when: battlemage_manage | default(false)

- name: Bootstrap Cephadm Host
  hosts: ceph_bootstrap
  become: true
  roles:
    - role: ceph-bootstrap

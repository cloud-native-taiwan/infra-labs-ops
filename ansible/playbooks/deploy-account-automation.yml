# Deploy account_automation to the deploy host (not the OpenStack/Ceph fleet).
# The deploy host controls the cluster and runs operational tools.
#
# Container spec is defined in tools/account_automation/docker-compose.yml
# (single source of truth). This playbook syncs source code and secrets to
# the remote host, then drives docker compose.
---
- name: Deploy account_automation container
  hosts: deploy_host
  become: true
  vars:
    remote_base: /opt/infra-labs-tools
    remote_tool_dir: "{{ remote_base }}/account_automation"
    local_tool_dir: "{{ playbook_dir }}/../../tools/account_automation"
    local_secrets_dir: "{{ playbook_dir }}/../private/tools/account_automation"
    # Image tag to deploy: pass -e tools_image_tag=sha-<commit> (see
    # build-tools.yml). No default here on purpose -- silently falling back to
    # the floating "latest" tag defeats the point of pinning a specific build.

  # Textfile node_exporter: the container records each successful run as
  # task_account_automation.prom (deploy-host-alerts.rules). Roles run before
  # tasks, so the metrics directory exists (uid 10001) before compose up.
  roles:
    - role: deploy-host-textfile
      vars:
        deploy_host_textfile_seed_tasks:
          - account_automation

  tasks:
    - name: Create remote tool directory
      ansible.builtin.file:
        path: "{{ remote_tool_dir }}"
        state: directory
        mode: "0755"

    # secrets/ and .env exist only on the remote (copied below from
    # local_secrets_dir); excluding them keeps --delete from removing them on
    # every run. Never add --delete-excluded.
    - name: Sync tool source to deploy host
      ansible.builtin.shell: >-
        rsync -azi --delete
        --rsync-path="sudo rsync"
        --exclude=.venv
        --exclude=.git
        --exclude=__pycache__
        --exclude=.pytest_cache
        --exclude=.mypy_cache
        --exclude=.ruff_cache
        --exclude=.coverage
        --exclude=.env
        --exclude=/secrets/
        "{{ local_tool_dir }}/"
        "{{ ansible_user | default('debian') }}@{{ ansible_host | default(inventory_hostname) }}:{{ remote_tool_dir }}/"
      delegate_to: localhost
      become: false
      register: rsync_result
      # rsync -i prints one line per changed file; an empty stdout means
      # nothing transferred, so the task is genuinely unchanged.
      changed_when: rsync_result.stdout | trim | length > 0

    - name: Copy .env to deploy host
      ansible.builtin.copy:
        src: "{{ local_secrets_dir }}/.env"
        dest: "{{ remote_tool_dir }}/.env"
        mode: "0600"
      register: env_copy
      no_log: true
      diff: false

    # Mounted into the container as a directory, so the container uid must
    # own it (a single-file mount never traversed it).
    - name: Create remote secrets directory
      ansible.builtin.file:
        path: "{{ remote_tool_dir }}/secrets"
        state: directory
        owner: "10001"
        group: "10001"
        mode: "0700"

    - name: Copy secret files to deploy host
      ansible.builtin.copy:
        src: "{{ local_secrets_dir }}/{{ item }}"
        dest: "{{ remote_tool_dir }}/secrets/{{ item }}"
        owner: "10001"
        group: "10001"
        mode: "0600"
      loop:
        - service-account.json
        - clouds.yaml
      register: secrets_copy
      no_log: true
      diff: false

    - name: Run pre-deploy verification on deploy host
      ansible.builtin.command:
        cmd: ./deploy/verify.sh
        chdir: "{{ remote_tool_dir }}"
      changed_when: false

    # Recreate when this run changed .env or a secret, so the new values apply
    # now rather than relying on compose's own change detection.
    # -e tools_force_recreate=true forces one, e.g. after a run that copied a
    # change but failed before reaching this task.
    - name: Pull image from GHCR and deploy via docker compose
      ansible.builtin.command:
        cmd: >-
          docker compose up -d --pull always{{ ' --force-recreate'
          if env_copy is changed or secrets_copy is changed
          or tools_force_recreate | default(false) | bool else '' }}
        chdir: "{{ remote_tool_dir }}"
      environment:
        IMAGE_TAG: "{{ tools_image_tag }}"
      register: compose_result
      # `docker compose up` exits 0 even when nothing changed. Compose reports
      # its actions on stderr, so key change detection off those markers.
      changed_when: >-
        compose_result.stderr is search('(?i)(Pulled|Created|Recreated|Started)')

    - name: Verify container is running
      community.docker.docker_container_info:
        name: account-automation
      register: container_info
      failed_when: not container_info.exists or container_info.container.State.Status != 'running'

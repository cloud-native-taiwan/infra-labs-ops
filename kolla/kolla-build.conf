# Tracked kolla-build configuration.
#
# Why this file exists:
#   scripts/kolla-build-and-push.sh passes this file via --config-file. When
#   --config-file is given explicitly, oslo.config loads ONLY this file and
#   skips the default /etc/kolla/kolla-build.conf discovery (oslo.config
#   bug #1699324). That deliberately bypasses whatever profile/image filter
#   happens to live on the build host -- the cause of cloudkitty images
#   silently never being built -- so the full image set is reproducible
#   from the repo regardless of host state.
#
# Default (no --profile): kolla-build builds ALL images, which includes
# cloudkitty and opensearch. The profile below is only for TARGETED rebuilds:
#   kolla-build --config-file kolla/kolla-build.conf -b ubuntu \
#     --registry registry.cloudnative.tw --push --tag 2026.2-amd64 \
#     --profile cloudkitty
#
# Build params (base, registry, tag, push) are passed on the CLI by the
# script and intentionally NOT duplicated here to avoid drift.
#
# Paths below are relative to the repo root; the script cd's there first.
# Run manual kolla-build commands from the repo root too.

[DEFAULT]
# Hibiscus (2026.2) has no noble Ubuntu Cloud Archive pocket, so kolla
# 23.0.0's default noble-updates/hibiscus 404s. Upstream pins gazpacho after
# the 23.0.0 tag (LP#2170813, change 1010410); this does the same for 23.0.0.
openstack_release_codename = gazpacho

# Ceph client libs from download.ceph.com Tentacle instead of UCA. UCA ships
# 20.2.0, which mis-parses aes256k CephX keys (LP#2166524); aes256k needs
# >= 20.2.4 (CVE-2025-30156). Drop these three once UCA or kolla ships
# 20.2.4+ (kolla change 1002008, LP#2166613).
apt_sources_list = kolla/ceph-tentacle.list
apt_preferences = kolla/ceph-tentacle.pref
template_override = kolla/template-overrides.j2

[profiles]
# CloudKitty data path: API + processor + its storage backend (opensearch,
# per cloudkitty_storage_backend in kolla/globals.yml -- influxdb was
# dropped in kolla-ansible 2026.1). Parent images (cloudkitty-base,
# openstack-base, base) are pulled in automatically. Note: the cloudkitty
# Horizon panel is baked into the `horizon` image at build time
# (enable_horizon_cloudkitty), so rebuild `horizon` separately if the
# dashboard panel is needed.
cloudkitty = cloudkitty-api,cloudkitty-processor,opensearch
